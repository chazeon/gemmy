<script>
  // The theme, set before the first paint so a dark page never flashes light. It reads the key that web/src/ui/theme.ts
  // writes (gemmy.theme) and sets data-theme only for Light or Dark; Auto leaves it off, so the system's scheme applies.
  // The `dark` class (shadcn's variant, for the overlay) is set to match: Dark, or Auto with a dark system.
  (function () {
    const THEME_KEY = "gemmy.theme";
    let choice = null;
    try {
      choice = localStorage.getItem(THEME_KEY);
    } catch (error) {
      // storage refused: the page follows the system, as Auto does
    }
    if (choice === "light" || choice === "dark") document.documentElement.setAttribute("data-theme", choice);
    const dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) document.documentElement.classList.add("dark");
  })();
</script>
