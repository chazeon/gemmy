[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemmy"
version = "0.1.0"
description = "ASE-powered Blender scene builder for crystal structures."
readme = "README.md"
# Rendering needs Blender 4.2 LTS or newer (bundled Python 3.11).
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "ase>=3.23",
    "pydantic>=2",
    "tyro>=1.0.17",
]

[project.scripts]
gemmy = "gemmy.cli:main"

[tool.uv.config-settings-package]
# The slim build: fastatoms' symmetry module is not needed by the readers.
fastatoms = { "cmake.define.FASTATOMS_WITH_SYMMETRY" = "OFF" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
gemmy = ["viewer/*", "render/fonts/*.ttf", "render/fonts/OFL.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The browser suite (headless Chrome, ~20 s) and the slow tests (heavy examples, the site build) stay out of the default
# run; scripts/check.sh --browser and --slow select them.
addopts = ["-m", "not browser and not slow"]
markers = [
    "blender: drives the real Blender backend in-process (needs bpy; skipped when it is not importable)",
    "browser: drives the viewer in headless Chrome (needs Chrome and Node 22+; skipped when either is missing)",
    "slow: compiles the heavy examples or builds the hosted site (about a second or more each; scripts/check.sh --slow)",
]

[dependency-groups]
blender = [
    "bpy==5.2.3 ; python_full_version == '3.13.*'",
]
dev = ["pytest>=8", "ruff>=0.6"]
# The fastatoms Python reader (GEMMY_READER=fastatoms, `uv sync --group fastatoms`). A group, not an extra, so the wheel's
# metadata names no git source. Without it the ASE reader is the only one.
fastatoms = ["fastatoms @ git+https://github.com/chazeon/fastatoms@5e9a9088eacc32d03872432c06827e8928b67d91"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# .claude/ holds agent worktrees (whole copies of the repo); never lint or format them from here.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The Blender entry script must extend sys.path before importing gemmy.
"scripts/blender_build_scene.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["gemmy"]
