# Solid C60 drawn as cages: each molecule's 60 carbons as one polyhedron (the truncated icosahedron,
# 12 pentagons and 20 hexagons), around an invisible He marker at the molecule's centre (POSCAR).
# Same idealised fcc packing as config.toml.
structure = "POSCAR"

[elements.C]
radius = 0.16
color = [0.35, 0.35, 0.38, 1.0]
material = "matte"

[elements.He]  # the centre marker: never drawn, only there so the cage has a centre
visible = false
radius = 0.1

[materials.covalent]
type = "principled"
base_color = [0.85, 0.85, 0.85, 1.0]
roughness = 0.4

[cells]
supercell = [2, 2, 2]
periodic = [true, true, true]

[[bonds]]
a = "C"
b = "C"
min = 1.3
max = 1.5
radius = 0.04
material = "covalent"
complete = "ends"

# Every carbon is 3.51 A from its molecule's centre; the next atom out is 6.55 A away.
[[polyhedra]]
center = "He"
ligands = ["C"]
min = 3.4
max = 3.6
min_coordination = 60
max_coordination = 60
color = [0.95, 0.55, 0.15, 1.0]
image_centers = true
