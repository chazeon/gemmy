# Solid C60 (idealised: all molecules in one orientation), fcc, 2x2x2 conventional cells (1920 atoms).
# Each molecule is drawn as a cage: the hull of its 60 carbons, a truncated icosahedron (12 pentagons, 20 hexagons).
structure = "POSCAR"

[elements.C]
radius = 0.16
color = [0.35, 0.35, 0.38, 1.0]
material = "matte"

[materials.covalent]
type = "principled"
base_color = [0.85, 0.85, 0.85, 1.0]
roughness = 0.4

[cells]
supercell = [2, 2, 2]
periodic = [true, true, true]

# C60 bonds are 1.40 and 1.45 A; intermolecular C-C is about 3 A, outside the window.
[[bonds]]
a = "C"
b = "C"
min = 1.3
max = 1.5
radius = 0.05
material = "covalent"
complete = "ends"

# One cage per molecule: the hull of its 60 carbons, which the bond window above joins into one molecule.
[[clusters]]
kind = "molecule"
atoms = ["C"]
min = 1.3
max = 1.5
min_size = 60
max_size = 60
color = [0.95, 0.55, 0.15, 1.0]
