# Nucleosome core particle (PDB 1KX5): 2 DNA strands (warm, labelled *_dna through labels.json) and 8 histone chains (cool).
# Bonds match species labels exactly, so each pair of labels has its own rule (C and C_dna are different labels).
structure = "1kx5.extxyz"
labels = { file = "labels.json" }

[cells]
periodic = [false, false, false]

[elements.C]
radius = 0.25
color = [0.45, 0.6, 0.75, 1.0]
material = "matte"

[elements.N]
radius = 0.28
color = [0.2, 0.4, 0.9, 1.0]
material = "matte"

[elements.O]
radius = 0.28
color = [0.35, 0.75, 0.85, 1.0]
material = "matte"

[elements.S]
radius = 0.32
color = [0.5, 0.9, 0.7, 1.0]
material = "matte"

[elements.C_dna]
radius = 0.25
color = [0.9, 0.55, 0.2, 1.0]
material = "matte"

[elements.N_dna]
radius = 0.28
color = [0.95, 0.75, 0.3, 1.0]
material = "matte"

[elements.O_dna]
radius = 0.28
color = [0.95, 0.3, 0.1, 1.0]
material = "matte"

[elements.P_dna]
radius = 0.32
color = [1.0, 0.85, 0.2, 1.0]
material = "matte"

[materials.covalent]
type = "principled"
base_color = [0.85, 0.85, 0.85, 1.0]
roughness = 0.4

